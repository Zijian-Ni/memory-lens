name: Bug report
description: Something parsed wrong, clustered wrong, or mutated data it should not have
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste real memory files.**
        Reduce the problem to a few synthetic markdown lines.
  - type: dropdown
    id: command
    attributes:
      label: Which command?
      options: [inventory, dupes, decay, prune, export, viewer, other]
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal sample (synthetic)
      description: The smallest markdown that reproduces the problem. No real names, no secrets.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected vs what happened
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: If this is a data-loss report
      options:
        - label: I still have the timestamped backup under `_memory-lens-backups/`
        - label: I have not run prune a second time
  - type: input
    id: version
    attributes:
      label: memory-lens version and Node version
      placeholder: "0.1.0 / Node 20.11.0"
