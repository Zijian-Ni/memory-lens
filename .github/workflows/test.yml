name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test (zero dependencies — no install step needed)
        run: npm test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: CLI help and inventory on the synthetic fixture
        run: |
          node src/cli.js help
          node -e '
            import { writeSyntheticMemory, rmrf } from "./test/fixtures.js";
            import { spawnSync } from "node:child_process";
            const dir = writeSyntheticMemory();
            try {
              const r = spawnSync(process.execPath, ["src/cli.js", "inventory", dir, "--json"], { encoding: "utf8" });
              if (r.status !== 0) { console.error(r.stderr); process.exit(1); }
              const j = JSON.parse(r.stdout);
              if (!(j.files >= 5 && j.entries >= 10)) process.exit(1);
              console.log("smoke ok", j.files, "files", j.entries, "entries");
            } finally { rmrf(dir); }
          '
